name: iOS Swift TestFlight

# 手动触发：签名、归档，上传到 App Store Connect，处理完出现在 TestFlight（ADR 0023）。
# 平时推送仍由 ios-swift-build.yml 测试、出未签名 IPA，不会每次推送都传一版。
on:
  workflow_dispatch:
    inputs:
      xcode_app:
        description: "可选：指定 Xcode 路径（例如 /Applications/Xcode_27.0.app）；留空使用 runner 默认 Xcode"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-swift-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive, sign and upload to TestFlight
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      OUT: ${{ github.workspace }}/ci-out
      XCODE_APP: ${{ inputs.xcode_app }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: bash ios-swift/ci/toolchain.sh "$OUT"

      # 构建号 = 运行次数 × 10 + 重跑次数：重跑同一次也不会和已上传的重复
      - name: Archive and upload
        id: upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash ios-swift/ci/archive-upload.sh "$OUT" "$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))"

      - name: Report errors as annotations
        if: failure()
        run: bash ios-swift/ci/annotate-failure.sh "$OUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## TestFlight upload"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Version: ${{ steps.upload.outputs.version }} ($(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} )))"
            echo
            echo '```'
            cat "$OUT/toolchain.txt" 2>/dev/null || echo "toolchain.txt missing"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-logs-${{ github.run_number }}
          path: |
            ci-out/logs/
            ci-out/toolchain.txt
          if-no-files-found: warn
          retention-days: 14
